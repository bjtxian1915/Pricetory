/* 單位全部用 pt:整張收據寬 164.409pt = 58mm,內容區 136pt = 48mm(與設計稿 PDF 完全相同) */
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{background:#8a8a8a;font-family:"NotoTC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:12px 0 40px}
body.viewer{background:#1a1830;padding:0}
.toolbar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar button{font:500 13px "NotoTC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:7px 12px;border:0;border-radius:6px;cursor:pointer}
#receipt{zoom:2.6;width:164.409pt;margin:0 auto;padding:6pt 14pt 7pt;background:var(--page);color:var(--ink);font-weight:400;overflow:hidden}
.mt{font-family:"KozMin","NotoTC",serif;font-weight:400;-webkit-text-stroke:0}

.digital{--page:#25223c;--ink:#fff;--sub:#d6d0e2;--accent:#abca3c;--accent-ink:#25223c;--purple:#b36eb5;--sec:#b36eb5;--chipbg:#abca3c;--chipink:#25223c;--basefill:none;--basestroke:#b36eb5;--finalfill:#abca3c}
.print{--page:#fff;--ink:#000;--sub:#000;--accent:#000;--accent-ink:#000;--purple:#000;--sec:#000;--chipbg:#fff;--chipink:#000;--basefill:#000;--basestroke:#000;--finalfill:#000}

.dots{height:1.4pt;background:radial-gradient(circle,var(--ink) .6pt,transparent .66pt) 0 0/3.1pt 1.4pt repeat-x}
.logo{display:block;width:100%;height:auto;margin-top:7pt}
/* 粗線:實線 + 尾端短虛線 */
.ln{display:block;position:relative;height:var(--h,1.25pt);color:var(--lc,var(--ink));
  background:linear-gradient(currentColor,currentColor) 0 0/var(--s,69%) 100% no-repeat}
.ln::after{content:"";position:absolute;top:0;bottom:0;left:calc(var(--s,69%) + var(--gap,1.2pt));right:0;
  background:repeating-linear-gradient(270deg,currentColor 0 var(--on,5.6pt),transparent var(--on,5.6pt) var(--per,7.4pt))}
.rule{margin-top:5pt}
.row{display:flex;align-items:center;height:11pt;margin:8pt 0}
.lbl{font-size:7.7pt;line-height:11pt;white-space:nowrap}
.print .lbl{background:#000;color:#fff;padding:0 .6pt;-webkit-text-stroke:.3pt #fff}
.print .banner .r,.print .rtab span,.print .cl,.print .cn{-webkit-text-stroke:.3pt #fff}
.leader{flex:1;height:.5pt;background:var(--ink);margin:0 7pt 0 3pt}
.val{font-size:6pt;white-space:pre;font-weight:400}
.row.sub .val{font-size:6.4pt}
.row.sub{margin-top:11.3pt}

.banner{position:relative;height:22.8pt;margin-top:4pt}
.print .banner svg,.print .rtab svg{shape-rendering:crispEdges}
.banner svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.banner .l,.banner .r{position:absolute;top:0;height:100%;display:flex;align-items:center;color:#fff;white-space:pre}
.banner .l{left:2pt;font-size:16.5pt}
.banner .r{right:2pt;font-size:8pt;padding-bottom:1pt}
.banner .r.dash::after{content:"";position:absolute;left:0;right:0;bottom:3.3pt;height:1.1pt;background:repeating-linear-gradient(90deg,#fff 0 4.4pt,transparent 4.4pt 6.6pt)}
.banner .r.big{font-size:16.5pt;right:3pt}

.panel{background:var(--grad,none);padding-bottom:1pt}
.digital .panel{--grad:linear-gradient(#25223c 0pt,#26233c 13.3pt,#27233d 63.3pt,#29243f 113.3pt,#2b2541 148.3pt,#2e2643 183.3pt,#342949 238.3pt,#3a2c4e 273.3pt,#433055 313.3pt,#513760 358.3pt,#583b66 378.3pt,#644170 403.3pt,#73497d 433.3pt,#a868ac 513.3pt)}
.sec{display:flex;align-items:center;gap:3.5pt;height:12pt;margin-top:12.9pt}
.sec b{font-weight:400;font-size:11pt;white-space:nowrap}
.sec .ln{flex:1;--h:.8pt;--lc:var(--sec);--s:76%}
svg.radar{display:block;width:100%;height:116pt;margin-top:3.8pt;overflow:visible}

.items{margin-top:15.2pt}
.item{min-height:40.3pt}
.item:first-child{min-height:42.8pt}
.head{display:flex;justify-content:space-between;align-items:center;height:7.5pt}
.chip{display:flex;align-items:center;height:7.5pt}
.cl,.cn{display:block;height:7.5pt;line-height:7.5pt;background:var(--chipbg);color:var(--chipink);white-space:nowrap;
  clip-path:polygon(2.4pt 0,100% 0,calc(100% - 2.4pt) 100%,0 100%)}
.cl{font-size:7pt;font-weight:400;padding:0 3.5pt 0 2.4pt}
.cn{font-size:7pt;font-weight:400;width:12.5pt;text-align:center;padding:0 0 0 1.2pt;letter-spacing:-.15pt}
.print .cl,.print .cn{background:#000;color:#fff}
.bar{width:12.5pt;height:7.5pt;background:var(--accent);clip-path:polygon(2.4pt 0,100% 0,calc(100% - 2.4pt) 100%,0 100%)}
.bid{font-size:7.2pt;white-space:nowrap;font-weight:400}
.said{list-style:none;margin:3.2pt 0 .9pt 1.8pt}
.said li{font-size:5.3pt;line-height:10.4pt;color:var(--sub);display:flex;align-items:center;gap:2pt;font-weight:400}
.said li::before{content:"";flex:none;width:2.4pt;height:2.4pt;background:var(--accent)}
.items+.ln{margin-top:4pt}

.company{font-weight:400;text-align:center;line-height:1.1;margin-top:5pt;white-space:nowrap;overflow:hidden}
.title{font-size:13.1pt;font-weight:400;text-align:right;line-height:14pt;margin-top:6pt;padding-bottom:2pt}
.verdict{height:45.6pt;padding-bottom:9.2pt;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-size:37pt;margin-top:-.8pt;white-space:nowrap}
.rtab{position:relative;z-index:1;width:62.4pt;height:9pt;margin-top:-9pt}
.rtab svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.print .rtab span{color:#fff;font-weight:400}
.rtab span{position:absolute;left:0;right:0;top:0;text-align:center;font-size:7.7pt;line-height:9pt;font-weight:400}
.rbox{border:.5pt solid #fff;min-height:var(--rh,125.6pt);padding:7pt 3.2pt 7pt 3.2pt;font-size:6.7pt;line-height:1.6;font-weight:400;color:var(--sub);white-space:pre-wrap}
.print .rbox{border:0;min-height:0;padding:3pt 2pt 0;color:#000}
.print .rlabel{margin-top:6pt}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:3pt;padding:10pt 0 4pt}
.qr{width:96pt;height:96pt;background:#fff}
.qr svg{display:block;width:100%;height:100%}
.qrbox p{font-size:5.4pt;color:#000}
.foot{font-size:5pt;text-align:center;margin:3pt 0 3pt;color:var(--sub);white-space:pre}

@page{size:58mm auto;margin:0}
@media print{body{background:#fff;padding:0}.toolbar{display:none}#receipt{zoom:1}}
</style>

const KEYS=[["skill","專業技能"],["exp","產業經驗"],["soft","軟實力"],["solve","問題解決"],["culture","文化價值觀"]];
const AXIS={skill:"專業技能",exp:"產業經驗",soft:"軟實力",solve:"問題解決與抗壓性",culture:"文化與價值觀契合"};
const fmt=n=>Number(n).toLocaleString("en-US");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* 雷達圖座標(pt),中心 (71.4,62.4)、半徑 50,滿分 10;排版數字取自設計稿 PDF */
function radar(sc,dig){
  const cx=71.4,cy=62.4,R=50,A=[-90,-18,54,126,198];
  const P=(i,r)=>{const a=A[i]*Math.PI/180;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const pl=a=>a.map(p=>p[0].toFixed(2)+","+p[1].toFixed(2)).join(" ");
  const ks=KEYS.map(k=>k[0]);
  let s=`<svg class="radar" viewBox="0 0 136 116" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="pg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#ad6bb0"/><stop offset=".55" stop-color="#5c3d6d"/><stop offset="1" stop-color="#2a2340"/></linearGradient></defs>`;
  s+=`<polygon points="${pl(A.map((_,i)=>P(i,R)))}" fill="${dig?'url(#pg)':'#000'}"/>`;
  for(let k=1;k<=5;k++) s+=`<polygon points="${pl(A.map((_,i)=>P(i,R*k/5)))}" fill="none" stroke="#fff" stroke-width="${dig?(k==5?.3:.25):(k==5?.5:.45)}"/>`;
  A.forEach((_,i)=>{const q=P(i,R);s+=`<line x1="${cx}" y1="${cy}" x2="${q[0].toFixed(2)}" y2="${q[1].toFixed(2)}" stroke="#fff" stroke-width="${dig?.25:.45}"/>`});
  const dp=ks.map((k,i)=>P(i,R*Math.min(sc[k].score,10)/10));
  s+=`<polygon points="${pl(dp)}" fill="${dig?'rgba(255,255,255,.55)':'#fff'}"/>`;
  dp.forEach(p=>s+=`<rect x="${(p[0]-1.1).toFixed(2)}" y="${(p[1]-1.1).toFixed(2)}" width="2.2" height="2.2" fill="#fff" stroke="${dig?'#4a3a62':'#000'}" stroke-width=".3"/>`);
  const f=dig?'#fff':'#000';
  const L=[ // [label x, label baseline, anchor, score x, score baseline, anchor]  (取自設計稿 PDF 量測)
    [70.9,4.9,'middle',71.4,10.4,'middle'],
    [120.2,41.3,'start',121.1,47.6,'middle'],
    [100.5,111.4,'start',101.9,107.1,'middle'],
    [43.1,111.4,'end',41,107.1,'middle'],
    [1.4,39.4,'start',21.8,45.9,'middle']];
  // 黑白列印版:軸標籤 5pt、「文化…」「問題解決…」折成兩行(取自設計稿 PDF 第 1 頁)
  const PL={skill:[[70.6,3.5]],exp:[[113.5,41.3]],soft:[[93.5,114.3]],solve:[[18.7,113.9],[18.7,119.9]],culture:[[0.2,33.6],[0.2,39.6]]};
  const PT={skill:["專業技能"],exp:["產業經驗"],soft:["軟實力"],solve:["問題解決與","抗壓性"],culture:["文化與","價值觀契合"]};
  ks.forEach((k,i)=>{const l=L[i];
    if(dig) s+=`<text x="${l[0]}" y="${l[1]}" text-anchor="${l[2]}" font-size="3.7" fill="${f}" fill-opacity=".78" font-weight="400">${AXIS[k]}</text>`;
    else PT[k].forEach((line,j)=>{s+=`<text x="${PL[k][j][0]}" y="${PL[k][j][1]}" text-anchor="${k==="skill"?"middle":"start"}" font-size="5" fill="${f}" font-weight="400">${line}</text>`});
    s+=`<text x="${l[3]}" y="${l[4]}" text-anchor="${l[5]}" font-size="6.4" fill="${f}" font-weight="400">${sc[k].score}</text>`;});
  return s+"</svg>";
}
const para=(l,r,right)=>`<polygon points="${l}"/>`;

function banner(kind,left,right,dig,hired){
  const fill = kind==="base"?"var(--basefill)":"var(--finalfill)";
  const stroke = kind==="base"?"var(--basestroke)":"none";
  const sw = kind==="base"?".7":"0";
  const rcls = right.big?"r big":"r dash";
  return `<div class="banner"><svg viewBox="0 0 136 22.8" preserveAspectRatio="none">
    <polygon points="0.35,0.35 76,0.35 71.2,22.45 0.35,22.45" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
    <polygon points="79.1,0.35 135.65,0.35 135.65,22.45 75.2,22.45" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>
    ${kind==="base"&&dig?'<polygon points="129.6,0.35 135.65,0.35 135.65,6.4" fill="#b36eb5"/>':''}
  </svg><div class="l mt">${left}</div><div class="${rcls} mt">${right.t}</div></div>`;
}


/* ============ 收據資料 ⇄ QR 文字(資料直接放在 QR 裡,不需要資料庫) ============ */
const B36="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const pack=d=>JSON.stringify([d.id,d.datetime,d.job,d.base,d.hired?1:0,d.company||"",d.reason||"",KEYS.map(([k])=>[d.scores[k].score,d.scores[k].bid||0,d.scores[k].said||[]])]);
const unpack=s=>{const a=JSON.parse(s),sc={};KEYS.forEach(([k],i)=>{sc[k]={score:a[7][i][0],bid:a[7][i][1],said:a[7][i][2]}});return{id:a[0],datetime:a[1],job:a[2],base:a[3],hired:!!a[4],company:a[5],reason:a[6],scores:sc}};
async function pipe(u8,S){const s=new S("deflate-raw"),w=s.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(s.readable).arrayBuffer())}
const toB36=u8=>BigInt("0x01"+[...u8].map(b=>b.toString(16).padStart(2,"0")).join("")).toString(36).toUpperCase();
function fromB36(s){let n=0n;for(const c of s.toUpperCase())n=n*36n+BigInt(B36.indexOf(c));let h=n.toString(16);if(h.length%2)h="0"+h;h=h.slice(2);const u=new Uint8Array(h.length/2);for(let i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u}
async function encodeReceipt(d){
  const u8=new TextEncoder().encode(pack(d));
  if(typeof CompressionStream==="function") return "C"+toB36(await pipe(u8,CompressionStream));
  return "R"+toB36(u8);
}
async function decodeReceipt(p){
  const bytes=fromB36(p.slice(1));
  const u8=p[0].toUpperCase()==="C"?await pipe(bytes,DecompressionStream):bytes;
  return unpack(new TextDecoder().decode(u8));
}
const cut=(s,n)=>[...s].length>n?[...s].slice(0,n-1).join("")+"…":s;
function shrink(d,lvl){ // QR 太密會掃不到:文字太長時依序縮短「你說」和原因
  if(!lvl) return d;
  const L=lvl==1?{s:16,r:70,n:9}:{s:12,r:40,n:1}, sc={};
  KEYS.forEach(([k])=>{const x=d.scores[k];sc[k]={score:x.score,bid:x.bid,said:(x.said||[]).slice(0,L.n).map(t=>cut(t,L.s))}});
  return Object.assign({},d,{scores:sc,reason:cut(d.reason||"",L.r)});
}
function makeQR(payload){const qr=qrcode(0,"L");qr.addData(PUBLIC_URL+"#","Byte");qr.addData(payload,"Alphanumeric");qr.make();return qr}
function qrSVG(qr){const n=qr.getModuleCount(),z=2;let p="";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))p+=`M${c+z} ${r+z}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*z} ${n+2*z}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#000"/></svg>`}
async function fillQR(d){
  let qr,lvl=0;
  for(;lvl<3;lvl++){qr=makeQR(await encodeReceipt(shrink(d,lvl)));if(qr.getModuleCount()<=101||lvl==2)break} // 101 格 = 版本 22
  const el=document.getElementById("qr"); if(!el||CUR!==d) return;
  el.innerHTML=qrSVG(qr); el.dataset.modules=qr.getModuleCount(); el.dataset.trimmed=lvl;
  if(qr.getModuleCount()>101) console.warn("QR 太密,可能掃不到:請縮短『你說』或原因文字");
}

let DIG=false, CUR=null;
function render(d){
  CUR=d;
  const el=document.getElementById("receipt");
  el.className=DIG?"digital":"print";
  const add=KEYS.reduce((t,[k])=>t+(d.scores[k].bid||0),0);
  const items=KEYS.map(([k,name])=>{
    const x=d.scores[k], nb=(name.length<=3||!(x.bid>0))?4:3;
    const said=(x.said&&x.said.length?x.said.map(t=>`<li>你說：「${esc(t)}」</li>`).join(""):`<li>未提及相關能力</li>`);
    return `<div class="item"><div class="head"><div class="chip"><span class="cl">${name}</span><span class="cn">${x.score}</span>${'<i class="bar"></i>'.repeat(nb)}</div>
      <div class="bid">${x.bid>0?'+ NT$ '+fmt(x.bid):'不出價'}</div></div><ul class="said">${said}</ul></div>`;
  }).join("");
  const lbl=t=>`<span class="lbl">${t}</span>`;
  const row=(t,v,c="")=>`<div class="row ${c}">${lbl(t)}<i class="leader"></i><span class="val">${v}</span></div>`;
  const cs=d.company?Math.min(33.8,136/[...d.company].length):33.8;
  const reasonHTML = DIG
    ? `<div class="rtab"><svg viewBox="0 0 62.4 9"><polygon points="0,9 9.6,0 49.6,0 62.4,9" fill="${DIG?"#abca3c":"#000"}"/><polyline points="0,9 9.6,0 49.6,0 62.4,9" fill="none" stroke="${DIG?"#fff":"#000"}" stroke-width=".5"/></svg><span>原因</span></div><div class="rbox" style="--rh:${d.hired?125.6:177}pt">${esc(d.reason)}</div>`
    : `<div class="rlabel">${lbl("原因")}</div><div class="rbox">${esc(d.reason)}</div>
       <div class="qrbox"><div class="qr" id="qr"></div><p>掃描查看彩色電子版收據</p></div>`;
  el.innerHTML=`
    <div class="dots"></div>
    <img class="logo" alt="PRICETORY 衡評述值" src="${DIG?LOGO.digital:LOGO.print}">
    <i class="ln rule"></i>
    ${row("單號",esc(d.id))}
    ${row("日期／時間",esc(d.datetime))}
    ${row("應徵職位",esc(d.job))}
    ${banner("base","基本月薪",{t:"NT$   "+fmt(d.base)},DIG)}
    <div class="panel">
      <div class="sec"><b class="mt">能力明細</b><i class="ln"></i></div>
      ${radar(d.scores,DIG)}
      <div class="items">${items}</div>
      <i class="ln" style="margin-top:3.4pt"></i>
      ${row("加價小計","+ NT$  "+fmt(add),"sub")}
      <div style="height:3.5pt"></div>
      ${banner("final","最終月薪",d.hired?{t:"NT$  "+fmt(d.base+add)}:{t:"未錄用",big:1},DIG)}
      <div class="sec" style="margin-top:7.7pt"><b class="mt">錄取公司／職位</b><i class="ln" style="--s:0%;--gap:0pt;--on:6pt;--per:7.7pt;--lc:var(--ink);--h:.8pt"></i></div>
      ${d.hired?`<div class="company" style="font-size:${cs}pt">${esc(d.company)}</div><div class="title">${esc(d.job)}</div>`:`<div style="height:10.2pt"></div>`}
    </div>
    <div class="verdict mt" style="${d.hired?"":"height:48.1pt;padding-bottom:12pt"}">${d.hired?"錄取":"不錄用"}</div>
    ${reasonHTML}
    <div class="foot">／  歡迎再次光臨，  衡評述值關心您  ／</div>
    <div class="dots"></div>`;
  if(!DIG) window.__qrp=fillQR(d);
}
function setMode(m){DIG=(m==="digital");render(CUR)}
function setDemo(n){render(DEMOS[n])}

async function savePNG(){
  await document.fonts.ready; if(window.__qrp) await window.__qrp;
  const el=document.getElementById("receipt"), z=el.style.zoom;
  el.style.zoom=1;
  const pxpt=96/72;
  const opt=DIG?{scale:3,backgroundColor:null}
               :{x:14*pxpt,width:136*pxpt,scale:384/(136*pxpt),backgroundColor:"#fff"}; // 內容區 136pt → 剛好 384 點寬
  let c=await html2canvas(el,opt);
  el.style.zoom=z;
  if(!DIG&&c.width!==384){const o=document.createElement("canvas");o.width=384;o.height=c.height;o.getContext("2d").drawImage(c,0,0,384,c.height);c=o;} // 保證剛好 384 點寬
  if(!DIG){ // 熱感紙只有「黑/白」:把灰色邊緣與淡色一律轉成純黑或純白,大面積黑底才不會偏淡
    const cx=c.getContext("2d"),im=cx.getImageData(0,0,c.width,c.height),q=im.data;
    for(let i=0;i<q.length;i+=4){const v=(q[i]*.3+q[i+1]*.59+q[i+2]*.11)<190?0:255;q[i]=q[i+1]=q[i+2]=v;q[i+3]=255}
    cx.putImageData(im,0,0);
  }
  const a=document.createElement("a");a.download=`receipt_${CUR.id}_${DIG?"digital":"print"}.png`;a.href=c.toDataURL("image/png");a.click();
}

function fit(){ // 手機閱讀頁:依螢幕寬度縮放
  if(document.body.classList.contains("viewer")) document.getElementById("receipt").style.zoom=Math.min(2.6,innerWidth/219.2);
}
addEventListener("resize",fit);
(async function(){
  let d=DEMOS.hired;
  const h=location.hash.slice(1);
  if(h.length>20){ // 掃 QR 進來:收據資料就在網址 # 後面
    try{ d=await decodeReceipt(h); DIG=true; document.body.classList.add("viewer"); }
    catch(e){ console.error("收據資料讀取失敗",e); document.body.innerHTML='<p style="color:#fff;padding:24px;font:16px sans-serif">這張收據的資料無法讀取,請重新掃描。</p>'; return; }
  }
  if(DIG) document.querySelector(".toolbar").style.display="none";
  await document.fonts.ready;
  render(d); fit();
})();
